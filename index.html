<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Transformador de Texto</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Fraunces:wght@400;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #f5f2eb;
    --surface: #ffffff;
    --ink: #1a1814;
    --ink2: #6b6760;
    --ink3: #b0ada8;
    --accent: #c8440e;
    --accent-light: #fdf0eb;
    --border: rgba(26,24,20,0.12);
    --radius: 10px;
  }

  body {
    font-family: 'DM Mono', monospace;
    background: var(--bg);
    color: var(--ink);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 3rem 1.5rem;
  }

  header {
    text-align: center;
    margin-bottom: 2.5rem;
    animation: fadeUp 0.5s ease both;
  }

  header h1 {
    font-family: 'Fraunces', serif;
    font-size: clamp(2rem, 5vw, 3rem);
    font-weight: 600;
    letter-spacing: -0.02em;
    color: var(--ink);
    line-height: 1.1;
  }

  header h1 span { color: var(--accent); }

  header p {
    margin-top: 0.5rem;
    font-size: 13px;
    color: var(--ink2);
    letter-spacing: 0.04em;
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 1.5rem;
    width: 100%;
    max-width: 640px;
    animation: fadeUp 0.5s 0.1s ease both;
  }

  label {
    display: block;
    font-size: 11px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--ink2);
    margin-bottom: 0.5rem;
  }

  textarea {
    width: 100%;
    min-height: 120px;
    resize: vertical;
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 0.75rem 1rem;
    font-family: 'DM Mono', monospace;
    font-size: 14px;
    color: var(--ink);
    background: var(--bg);
    line-height: 1.6;
    outline: none;
    transition: border-color 0.2s;
  }

  textarea:focus { border-color: var(--accent); }

  .ops {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
    gap: 8px;
    margin: 1.25rem 0;
  }

  .op-btn {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 0.6rem 0.8rem;
    font-family: 'DM Mono', monospace;
    font-size: 12px;
    color: var(--ink);
    cursor: pointer;
    text-align: left;
    transition: all 0.15s;
    display: flex;
    align-items: center;
    gap: 7px;
  }

  .op-btn:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-light); }
  .op-btn:active { transform: scale(0.97); }
  .op-btn .icon { font-size: 15px; }

  .divider { border: none; border-top: 1px solid var(--border); margin: 1.25rem 0; }

  .result-wrap { position: relative; }

  #output {
    background: #1a1814;
    color: #f0ece3;
    border-radius: 6px;
    padding: 0.75rem 1rem;
    font-family: 'DM Mono', monospace;
    font-size: 14px;
    line-height: 1.6;
    min-height: 80px;
    white-space: pre-wrap;
    word-break: break-word;
  }

  .copy-btn {
    position: absolute;
    top: 8px; right: 8px;
    background: rgba(255,255,255,0.1);
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 5px;
    color: #f0ece3;
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    padding: 4px 10px;
    cursor: pointer;
    transition: background 0.15s;
  }
  .copy-btn:hover { background: rgba(255,255,255,0.2); }

  .stats {
    display: flex;
    gap: 1.5rem;
    margin-top: 1rem;
    font-size: 12px;
    color: var(--ink3);
  }

  .stats span b { color: var(--ink2); font-weight: 500; }

  footer {
    margin-top: 2.5rem;
    font-size: 11px;
    color: var(--ink3);
    letter-spacing: 0.05em;
    animation: fadeUp 0.5s 0.2s ease both;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(12px); }
    to   { opacity: 1; transform: translateY(0); }
  }
</style>
</head>
<body>

<header>
  <h1>Transforma<span>dor</span></h1>
  <p>conversiones de texto · al instante · sin instalar nada</p>
</header>

<div class="card">
  <label for="input">Texto de entrada</label>
  <textarea id="input" placeholder="Escribe o pega tu texto aquí..."></textarea>

  <div class="ops">
    <button class="op-btn" onclick="transform('upper')"><span class="icon">⬆</span> MAYÚSCULAS</button>
    <button class="op-btn" onclick="transform('lower')"><span class="icon">⬇</span> minúsculas</button>
    <button class="op-btn" onclick="transform('title')"><span class="icon">✦</span> Título</button>
    <button class="op-btn" onclick="transform('sentence')"><span class="icon">◆</span> Oración</button>
    <button class="op-btn" onclick="transform('reverse')"><span class="icon">↺</span> Invertir</button>
    <button class="op-btn" onclick="transform('noSpaces')"><span class="icon">✕</span> Sin espacios</button>
    <button class="op-btn" onclick="transform('slug')"><span class="icon">—</span> slug-url</button>
    <button class="op-btn" onclick="transform('camel')"><span class="icon">◉</span> camelCase</button>
    <button class="op-btn" onclick="transform('lines')"><span class="icon">≡</span> Por líneas</button>
    <button class="op-btn" onclick="transform('trim')"><span class="icon">◻</span> Limpiar</button>
  </div>

  <hr class="divider">

  <label>Resultado</label>
  <div class="result-wrap">
    <div id="output">El resultado aparecerá aquí…</div>
    <button class="copy-btn" onclick="copyResult()">copiar</button>
  </div>

  <div class="stats">
    <span><b id="chars">0</b> caracteres</span>
    <span><b id="words">0</b> palabras</span>
    <span><b id="lines">0</b> líneas</span>
  </div>
</div>

<footer>hecho con Claude · archivo HTML · sin servidor · funciona offline</footer>

<script>
  const inp = document.getElementById('input');
  const out = document.getElementById('output');

  inp.addEventListener('input', updateStats);

  function updateStats() {
    const t = inp.value;
    document.getElementById('chars').textContent = t.length;
    document.getElementById('words').textContent = t.trim() ? t.trim().split(/\s+/).length : 0;
    document.getElementById('lines').textContent = t ? t.split('\n').length : 0;
  }

  function transform(type) {
    const t = inp.value;
    if (!t.trim()) { out.textContent = 'Escribe algo primero…'; return; }
    let r = t;
    switch(type) {
      case 'upper':    r = t.toUpperCase(); break;
      case 'lower':    r = t.toLowerCase(); break;
      case 'title':    r = t.replace(/\w\S*/g, w => w.charAt(0).toUpperCase() + w.slice(1).toLowerCase()); break;
      case 'sentence': r = t.toLowerCase().replace(/(^\s*\w|[.!?]\s*\w)/g, c => c.toUpperCase()); break;
      case 'reverse':  r = t.split('').reverse().join(''); break;
      case 'noSpaces': r = t.replace(/\s+/g, ''); break;
      case 'slug':     r = t.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/\s+/g,'-').replace(/[^a-z0-9-]/g,''); break;
      case 'camel':    r = t.toLowerCase().replace(/[^a-zA-Z0-9]+(.)/g, (_,c) => c.toUpperCase()); break;
      case 'lines':    r = t.split(/\s+/).join('\n'); break;
      case 'trim':     r = t.split('\n').map(l => l.trim()).filter(l => l).join('\n'); break;
    }
    out.textContent = r;
  }

  function copyResult() {
    const text = out.textContent;
    if (!text || text === 'El resultado aparecerá aquí…') return;
    navigator.clipboard.writeText(text).then(() => {
      const btn = document.querySelector('.copy-btn');
      btn.textContent = '¡copiado!';
      setTimeout(() => btn.textContent = 'copiar', 1500);
    });
  }
</script>
</body>
</html>
